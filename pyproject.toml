[project]
name = "tesla-clearview"
version = "0.1.0"
description = "On-demand Tesla windscreen/camera clarity checks and smart pre-departure climate via the Tesla Fleet API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
clearview = "clearview.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
