<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>clearview login</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --bg:#f5f5f7; --card:#fff; --muted:#6e6e73; --accent:#0a66d8; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --bg:#111; --card:#1c1c1e; --muted:#a1a1a6; --accent:#4c9dff; } }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:10vh auto; padding:0 16px; }
  .card { background:var(--card); border-radius:14px; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); margin:8px 0; }
  code, textarea { font:13px ui-monospace,monospace; }
  textarea { width:100%; box-sizing:border-box; height:90px; margin-top:8px; border-radius:8px; padding:8px; }
  button { margin-top:8px; padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; }
</style>
</head>
<body>
<main><div class="card" id="out"><h1>Finishing Tesla login…</h1></div></main>
<script>
// Tesla redirects here with ?code=…&state=…. clearview runs on your home server, which the
// internet can't reach, so this page forwards the browser there. The home-server address is
// carried in `state` ("<nonce>.<base64url(url)>") and is only followed if it points at a
// private address: localhost, LAN IPs, bare hostnames, *.local / *.lan / *.home.arpa /
// *.internal, or a Tailscale name or IP. If `state` has no usable address, the page falls
// back to the fixed home address in home.json (written by scripts/publish_site.sh).
// The code is single-use and worthless without your client secret.
(function () {
  const out = document.getElementById("out");
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || "";

  function isPrivateHost(h) {
    h = h.toLowerCase().replace(/^\[|\]$/g, "");
    if (h === "localhost" || h === "::1") return true;
    if (/^[a-z0-9-]+$/.test(h) && !/^\d+$/.test(h)) return true;  // bare hostname, e.g. my-macbook
    if (/\.(local|lan|home|home\.arpa|internal|ts\.net)$/.test(h)) return true;
    const m = h.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
    if (!m) return false;
    const [a, b] = [+m[1], +m[2]];
    return a === 127 || a === 10 || (a === 172 && b >= 16 && b <= 31) ||
           (a === 192 && b === 168) || (a === 100 && b >= 64 && b <= 127);
  }

  function check(raw) {
    try {
      const u = new URL(raw);
      if (u.hostname === "0.0.0.0") u.hostname = "localhost";
      if (!/^https?:$/.test(u.protocol) || !isPrivateHost(u.hostname)) return null;
      if (!/\/(auth\/)?callback\/?$/.test(u.pathname)) return null;
      return u;
    } catch (e) { return null; }
  }

  function fromState() {
    const dot = state.indexOf(".");
    if (dot < 0) return null;
    try {
      let b = state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      return check(atob(b));
    } catch (e) { return null; }
  }

  async function fromHomeJson() {
    try {
      const r = await fetch("home.json", { cache: "no-store" });
      if (!r.ok) return null;
      const home = (await r.json()).home;
      return home ? check(home.replace(/\/+$/, "") + "/auth/callback") : null;
    } catch (e) { return null; }
  }

  function go(t) {
    q.forEach((v, k) => t.searchParams.set(k, v));
    location.replace(t.toString());
  }

  if (!(q.has("code") || q.has("error"))) return showFallback();
  const t = fromState();
  if (t) return go(t);
  fromHomeJson().then((h) => (h ? go(h) : showFallback()));

  function showFallback() {
    // No usable home-server address: show the URL so it can be pasted into
    // `clearview auth login --no-browser`.
    const err = q.get("error");
    out.innerHTML = "";
    const h = document.createElement("h1");
    h.textContent = err ? "Tesla login failed" : (q.has("code") ? "Copy this URL into clearview" : "clearview");
    out.appendChild(h);
    const p = document.createElement("p");
    p.textContent = err
      ? (q.get("error_description") || err)
      : q.has("code")
        ? "Couldn't tell which home server started this login. Paste the URL below where clearview asks for it."
        : "This page receives Tesla login redirects for a self-hosted clearview server.";
    out.appendChild(p);
    if (q.has("code")) {
      const ta = document.createElement("textarea");
      ta.readOnly = true; ta.value = location.href; out.appendChild(ta);
      const btn = document.createElement("button");
      btn.textContent = "Copy";
      btn.onclick = () => navigator.clipboard.writeText(location.href).then(() => (btn.textContent = "Copied"));
      out.appendChild(btn);
    }
  }
})();
</script>
</body>
</html>
